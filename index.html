<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Poem Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI French Poem Generator</h1>
      </header>

      <main>
        <form id="poem-generator-form">
          <div class="form-container">
            <input
              type="text"
              placeholder="Enter the topic of the French poem"
              autofocus
              required
              autocomplete="off"
              class="instructions"
              id="user-instructions"
            />
            <small class="hint">i.e:Flower, Paris, Cheese</small>
          </div>
          <input type="submit" class="submit-button" value="submit" />
        </form>

        <div class="poem hidden" id="poem"></div>
      </main>

      <footer>
        <small>
          <em>
            This AI project was coded by
            <a href="https://github.com/szouga" target="_blank">
              Sophie Clement Zouga Ndong</a
            >
            and is open-sourced on
            <a
              href="https://github.com/szouga/french-poem-generator"
              target="_blank"
              >GitHub</a
            >
            and is hosted on
            <a
              href="https://szouga.github.io/french-poem-generator/"
              target="_blank"
              >GitHub Pages</a
            >.
          </em>
        </small>
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
